name: Verify application and database rules

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # npm, not bun: bun.lock still pins ai@7.0.162 and @ai-sdk/openai@4.0.108, which the registry
      # does not publish, so `bun install --frozen-lockfile` cannot resolve this tree at all.
      # package-lock.json is the lockfile that matches the versions the owner pinned in package.json.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install exactly what package-lock.json pins
        run: npm ci
      - name: Run the suite and prove every test file loaded
        run: npm run test:load
      - name: Check production compilation
        run: npm run build

  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install local test database
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16 postgresql-client-16
      - name: Test migrations and permissions in a disposable database
        run: bash supabase/tests/run-local.sh
